name: Release huBoard

on:
  push:
    tags:
      - "v*-huboard.*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HUBOARD_KEYSTORE_PATH: ${{ github.workspace }}/.huboard-release.jks
      HUBOARD_KEYSTORE_PASSWORD: ${{ secrets.HUBOARD_KEYSTORE_PASSWORD }}
      HUBOARD_KEY_ALIAS: ${{ secrets.HUBOARD_KEY_ALIAS }}
      HUBOARD_KEY_PASSWORD: ${{ secrets.HUBOARD_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run release quality gate
        run: ./gradlew :app:testRunTestsUnitTest :app:lintRunTests --stacktrace

      - name: Restore release signing key
        env:
          HUBOARD_KEYSTORE_BASE64: ${{ secrets.HUBOARD_KEYSTORE_BASE64 }}
        run: |
          set -eu
          : "${HUBOARD_KEYSTORE_BASE64:?Missing HUBOARD_KEYSTORE_BASE64 secret}"
          : "${HUBOARD_KEYSTORE_PASSWORD:?Missing HUBOARD_KEYSTORE_PASSWORD secret}"
          : "${HUBOARD_KEY_ALIAS:?Missing HUBOARD_KEY_ALIAS secret}"
          : "${HUBOARD_KEY_PASSWORD:?Missing HUBOARD_KEY_PASSWORD secret}"
          printf '%s' "$HUBOARD_KEYSTORE_BASE64" | base64 --decode > "$HUBOARD_KEYSTORE_PATH"

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Package example theme
        run: tools/package-hbtheme.sh app/src/main/assets/visual-themes/hu_tao hu_tao.hbtheme

      - name: Verify and checksum APK
        id: apk
        run: |
          set -eu
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK" > "$APK.sha256"
          BADGING="$("$AAPT" dump badging "$APK" | head -n 1)"
          VERSION_CODE="$(printf '%s' "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          VERSION_NAME="$(printf '%s' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          APK_NAME="$(basename "$APK")"
          APK_SHA256="$(sha256sum "$APK" | cut -d ' ' -f 1)"
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          test "$GITHUB_REF_NAME" = "v$VERSION_NAME"
          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$APK_NAME" \
            --arg sha256 "$APK_SHA256" \
            '{versionCode: $versionCode, versionName: $versionName, apkUrl: $apkUrl, sha256: $sha256}' \
            > update.json
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          set -eu
          cp "$APK" huBoard-latest.apk
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" "$APK.sha256" huBoard-latest.apk update.json hu_tao.hbtheme --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" huBoard-latest.apk update.json hu_tao.hbtheme \
              --verify-tag \
              --generate-notes \
              --title "huBoard ${GITHUB_REF_NAME#v}"
          fi
