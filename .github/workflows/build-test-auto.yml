name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run unit tests and Android lint
        run: ./gradlew :app:testRunTestsUnitTest :app:lintRunTests --stacktrace

      - name: Archive failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: "*/build/reports"
          if-no-files-found: warn
